name: ML Unsupervised Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Experiment Execution and Metrics
      run: |
        python scripts/ejecutar_experimento.py

    - name: Verify Notebook Outputs and Integrity
      run: |
        python scripts/ejecutar_notebook_con_salidas.py
